<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 학습 마을 - /superlearning</title>
  <link rel="stylesheet" href="world.css">
</head>
<body>
<!-- The reward world. It renders progress-state.json as a growing isometric town:
     one building per mastered concept, climbing plot -> room -> house -> village -> city.
     Click a building to recall the concept it stands for (the town is a memory palace).

     DATA: world.js reads the inline <script id="world-data"> below first, so this page
     renders when opened straight from disk. When you copy templates/world/ into a vault's
     world/ folder, replace the inline JSON with the learner's live progress (or delete it
     and let world.js fetch ../progress-state.json over http). Keep .world-stage and
     .world-summary -- the gate checks for both (the world must be readable, not only drawn). -->
<div class="world-shell">

  <header class="world-head">
    <h1>내 학습 마을 · <span class="topic">내 마을</span></h1>
    <div class="world-stats">
      <span class="stat-chip tier">단계 <b>Plot</b></span>
      <span class="stat-chip">건물 <b data-stat-buildings>0</b></span>
      <span class="stat-chip">XP <b data-stat-xp>0</b></span>
      <span class="stat-chip">연속 <b data-stat-streak>0</b>일</span>
    </div>
  </header>

  <div class="world-stage" role="img" aria-label="학습 진행도를 보여주는 아이소메트릭 마을. 자세한 내용은 아래 마을 현황 참고.">
    <canvas></canvas>
  </div>

  <section class="world-panel" aria-live="polite">
    <p class="ph">건물을 누르면 그곳에서 배운 개념이 나옵니다. 기억만으로 먼저 떠올려 보세요.</p>
  </section>

  <section class="world-summary" aria-label="마을 현황 텍스트 요약">
    <h2>마을 현황</h2>
    <p class="empty">아직 빈 땅입니다.</p>
  </section>

</div>

<!-- demo progress so the template renders on its own; replace with the learner's state in a vault -->

    { "id": "recursion-vs-loop", "mastered": true, "retrievalPassed": true, "channel": "auditory" }

      { "id": "b3", "conceptId": "why-sorted-matters", "kind": "floor", "earned": true },
